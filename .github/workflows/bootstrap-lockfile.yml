name: One-time phase 00 lockfile bootstrap
on:
  push:
    branches:
      - feat/phase-00-foundation-stability

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/feat/phase-00-foundation-stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate and verify candidate lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo 'Lockfile already exists; no bootstrap required.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run db:generate
          npx prisma validate
          npm run typecheck
          npm test
          npm run verify:syntax
          npm run build
      - name: Commit only the reviewed dependency graph to this feature branch
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Lockfile already committed.'
            exit 0
          fi
          test -f package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(phase-00): commit verified npm dependency lockfile'
          git push origin HEAD:refs/heads/feat/phase-00-foundation-stability
