name: Phase 00 application checks

on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarthub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Source safety and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm test
      - run: npm run verify:foundation -- --require-lock

  build:
    name: Reproducible Prisma, TypeScript and Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma models without a database connection
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/smarthub?schema=public
          DIRECT_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/smarthub?schema=public
        run: npx prisma validate
      - run: npm run typecheck
      - run: npm run verify:syntax
      - run: npm test
      - run: npm run build
      - name: Verify actual Next.js public-page rendering and launch disclosures
        run: npm run verify:public-runtime
      - name: Install pinned browser test runner (ephemeral CI only)
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.1
      - name: Install Chromium with supported OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real desktop and mobile public-site browser acceptance
        run: npx playwright test -c playwright.public.config.mjs
      - name: Upload non-sensitive public-page review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarthub-phase18-public-screenshots
          path: playwright-artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm reviewed lockfile and foundation configuration
        run: npm run verify:foundation -- --require-lock

  isolated_postgres:
    name: Ephemeral PostgreSQL migrations and direct-role denial checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_ephemeral_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These literal test-only values are never read from repository secrets.
    # The runner destroys this container after each job.
    env:
      SMART_HUB_CI_POSTGRES_ONLY: I_ACKNOWLEDGE_EPHEMERAL_POSTGRES
      DIRECT_URL: postgresql://postgres:ci_only_ephemeral_password@127.0.0.1:5432/postgres?sslmode=disable
      DATABASE_URL: postgresql://postgres:ci_only_ephemeral_password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply and verify real Prisma migrations on disposable PostgreSQL
        run: node scripts/release/ci-postgres-integration.mjs
