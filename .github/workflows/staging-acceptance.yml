name: Phase 17 controlled staging acceptance

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending Prisma migrations to the isolated staging project (requires backup/restore evidence)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: smarthub-controlled-staging
  cancel-in-progress: false

jobs:
  staging-acceptance:
    name: Approved staging migration, database and five-role acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      RELEASE_STAGE_CONFIRM: I_ACKNOWLEDGE_STAGING_ONLY
      SMART_HUB_STAGE_SUPABASE_REF: ${{ vars.SMART_HUB_STAGE_SUPABASE_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SMART_HUB_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SMART_HUB_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      DIRECT_URL: ${{ secrets.SMART_HUB_STAGING_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.SMART_HUB_STAGING_DATABASE_URL }}
      STAGING_BASE_URL: ${{ vars.SMART_HUB_STAGING_BASE_URL }}
      STAGING_REVIEWED_ORIGIN: ${{ vars.SMART_HUB_STAGE_REVIEWED_ORIGIN }}
      PRODUCTION_BASE_URL: ${{ vars.SMART_HUB_PRODUCTION_BASE_URL }}
      PAYMENTS_ENABLED: "false"
      SUPPLIER_PAYOUTS_ENABLED: "false"
      PUBLIC_SIGNUP_ENABLED: "false"
      PAYSTACK_SECRET_KEY: ${{ secrets.SMART_HUB_STAGING_PAYSTACK_SECRET_KEY }}
      RELEASE_ACCEPTANCE_ENABLED: "true"
      RELEASE_HEALTH_TOKEN: ${{ secrets.SMART_HUB_STAGING_READINESS_TOKEN }}
      STAGING_READINESS_TOKEN: ${{ secrets.SMART_HUB_STAGING_READINESS_TOKEN }}
      STAGING_SESSION_BUYER_A: ${{ secrets.STAGING_SESSION_BUYER_A }}
      STAGING_SESSION_BUYER_B: ${{ secrets.STAGING_SESSION_BUYER_B }}
      STAGING_SESSION_FARMER: ${{ secrets.STAGING_SESSION_FARMER }}
      STAGING_SESSION_FIELD_AGENT: ${{ secrets.STAGING_SESSION_FIELD_AGENT }}
      STAGING_SESSION_OPERATIONS: ${{ secrets.STAGING_SESSION_OPERATIONS }}
      STAGING_SESSION_SUPER_ADMIN: ${{ secrets.STAGING_SESSION_SUPER_ADMIN }}
      STAGING_BUYER_A_SHIPMENT_ID: ${{ vars.STAGING_BUYER_A_SHIPMENT_ID }}
      STAGING_BUYER_A_SUPPORT_CASE_ID: ${{ vars.STAGING_BUYER_A_SUPPORT_CASE_ID }}
      FIELD_EVIDENCE_BUCKET: field-visit-evidence
      SHIPMENT_EVIDENCE_BUCKET: shipment-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reject wrong database and any non-staging deployment BEFORE migration
        run: |
          node --input-type=module -e 'import {assertStageTarget} from "./scripts/release/stage-target.mjs"; assertStageTarget();'
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate Prisma and run all static release gates
        run: |
          npm run db:generate
          npm run typecheck
          npm run verify:syntax
          npm test
          npm run build
      - name: Require reviewed backup/restore evidence before any staging migration
        if: ${{ inputs.apply_migrations }}
        env:
          STAGING_MIGRATIONS_APPROVED: ${{ vars.STAGING_MIGRATIONS_APPROVED }}
          STAGING_BACKUP_RESTORE_EVIDENCE: ${{ secrets.STAGING_BACKUP_RESTORE_EVIDENCE }}
        run: |
          if [ "$STAGING_MIGRATIONS_APPROVED" != "true" ] || [ -z "$STAGING_BACKUP_RESTORE_EVIDENCE" ]; then
            echo "Migration rejected: staging backup restoration evidence and approval are required."
            exit 1
          fi
          node --input-type=module -e 'import {assertStageTarget} from "./scripts/release/stage-target.mjs"; assertStageTarget();'
      - name: Migrate ONLY the separately reviewed staging project
        if: ${{ inputs.apply_migrations }}
        run: npm run db:migrate
      - name: Check exact migration history, RLS, Storage and authoritative quantities
        run: node scripts/release/check-stage-database.mjs
      - name: Verify staging app, five role sessions and cross-buyer boundaries
        run: node scripts/release/check-stage-http.mjs
